---
- job:
    name: base
    parent: null
    description: |
      The recommended base job.

      All jobs ultimately inherit from this.  It runs a pre-playbook
      which copies all of the job's prepared git repos on to all of
      the nodes in the nodeset.

      It also sets a default timeout value (which may be overidden).
    pre-run:
      - playbooks/base/pre.yaml
    post-run:
      - playbooks/base/upload-logs.yaml
    vars:
      ara_report_type: html
      ara_report_path: ara-report
      zuul_log_url: https://zuul-logs.teim.app
      zuul_logserver:
        host: zuul-logserver-ssh.zuul-system.svc.cluster.local
        username: zuul
        # Verified against the running log server through the Kubernetes API.
        host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICsltTivZhX8QWrcgGhd8djn1CSUwVX0rxgfMsO/4Jrp
    roles:
      - zuul: zuul/zuul-jobs
    timeout: 1800
    nodeset: ubuntu-24-04-single-node-pod
    override-checkout: main
