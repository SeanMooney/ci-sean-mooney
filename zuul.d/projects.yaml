- project:
    name: ^github.com/SeanMooney/.*
    manual-ci:
      jobs:
        - teim-code-review
- project:
    name: ^openstack/.*watcher.*
    automatic-ci:
      jobs:
        - teim-code-review
    manual-ci:
      jobs:
        - teim-code-review

- project:
    name: ^openstack/.*cyborg.*
    automatic-ci:
      jobs:
        - teim-code-review
    manual-ci:
      jobs:
        - teim-code-review
