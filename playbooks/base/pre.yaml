---
- hosts: localhost
  roles:
    - emit-job-header

- hosts: all
  tasks:
    - name: Install base packages
      package:
        name: "{{ item }}"
        state: present
      become: true
      loop:
        - git
        - python3
    - name: Install acl
      when: ansible_os_family == "Debian"
      become: true
      apt:
        state: present
        update_cache: true
        pkg:
          - acl  # required for become to work

- hosts: all
  roles:
    - start-zuul-console
    - ensure-output-dirs
    - log-inventory
    - validate-host
    - prepare-workspace-git
