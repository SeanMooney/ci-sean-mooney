---
- hosts: all
  vars:
    zuul_output_dir: "{{ ansible_user_dir }}/zuul-output"
  tasks:
    - name: Stage output from all nodes
      include_role:
        name: stage-output
      vars:
        stage_dir: "{{ zuul_output_dir }}"

    - name: Fetch output from all nodes
      when: (ansible_connection | default('ssh')) != 'kubectl'
      include_role:
        name: fetch-output

    - name: Set Kubernetes log destination for multiple nodes
      when:
        - (ansible_connection | default('ssh')) == 'kubectl'
        - groups['all'] | length > 1
      set_fact:
        log_path: "{{ zuul.executor.log_root }}/{{ inventory_hostname }}"

    - name: Set Kubernetes log destination for a single node
      when:
        - (ansible_connection | default('ssh')) == 'kubectl'
        - log_path is not defined
      set_fact:
        log_path: "{{ zuul.executor.log_root }}"

    - name: Define Kubernetes output locations
      when: (ansible_connection | default('ssh')) == 'kubectl'
      set_fact:
        kubectl_output_locations:
          - src: "{{ zuul_output_dir }}/logs"
            dest: "{{ log_path }}"
          - src: "{{ zuul_output_dir }}/artifacts"
            dest: "{{ zuul.executor.work_root }}/artifacts"
          - src: "{{ zuul_output_dir }}/docs"
            dest: "{{ zuul.executor.work_root }}/docs"

    - name: Ensure local Kubernetes output directories exist
      when: (ansible_connection | default('ssh')) == 'kubectl'
      delegate_to: localhost
      file:
        path: "{{ item.dest }}"
        state: directory
        mode: "0755"
      loop: "{{ kubectl_output_locations | default([]) }}"

    - name: Discover staged Kubernetes output
      when: (ansible_connection | default('ssh')) == 'kubectl'
      find:
        paths: "{{ item.src }}"
        file_type: file
        recurse: true
      loop: "{{ kubectl_output_locations | default([]) }}"
      register: kubectl_output_files

    - name: Ensure local Kubernetes output parent directories exist
      when: (ansible_connection | default('ssh')) == 'kubectl'
      delegate_to: localhost
      file:
        path: >-
          {{ item.0.item.dest }}/{{ item.1.path
             | regex_replace('^' + (item.0.item.src | regex_escape) + '/?', '')
             | dirname }}
        state: directory
        mode: "0755"
      loop: >-
        {{ ((kubectl_output_files | default({'results': []})).results)
           | subelements('files') }}

    - name: Fetch staged output over the Kubernetes connection
      when: (ansible_connection | default('ssh')) == 'kubectl'
      fetch:
        src: "{{ item.1.path }}"
        dest: >-
          {{ item.0.item.dest }}/{{ item.1.path
             | regex_replace('^' + (item.0.item.src | regex_escape) + '/?', '') }}
        flat: true
      loop: >-
        {{ ((kubectl_output_files | default({'results': []})).results)
           | subelements('files') }}

- hosts: localhost
  tasks:
    - name: Include Zuul manifest role
      include_role:
        name: generate-zuul-manifest
    - name: Generate bulk log download script
      include_role:
        name: local-log-download
      vars:
        local_log_download_api: 'https://zuul.teim.app/api/tenant/{{ zuul.tenant }}'
    - name: Upload logs to MinIO
      include_role:
        name: upload-logs-minio
      vars:
        upload_logs_s3_endpoint: "{{ zuul_log_targets.upload_logs_s3_endpoint }}"
        zuul_log_bucket: "{{ zuul_log_targets.zuul_log_bucket }}"
        zuul_log_aws_access_key: "{{ zuul_log_targets.zuul_log_aws_access_key }}"
        zuul_log_aws_secret_key: "{{ zuul_log_targets.zuul_log_aws_secret_key }}"
        zuul_log_create_indexes: "{{ zuul_log_targets.zuul_log_create_indexes | default(true) }}"
        zuul_log_bucket_public: "{{ zuul_log_targets.zuul_log_bucket_public | default(true) }}"
        upload_logs_s3_addressing_style: "{{ zuul_log_targets.upload_logs_s3_addressing_style | default('path') }}"
    # NOTE(ianw): file generated by local-log-download, upload_results
    # is registered by the upload-logs-swift role
    - name: Register quick-download link
      zuul_return:
        data:
          zuul:
            artifacts:
              - name: Download all logs
                url: 'download-logs.sh'
                metadata:
                  command: 'curl "{{ upload_results.url }}/download-logs.sh" | bash'
